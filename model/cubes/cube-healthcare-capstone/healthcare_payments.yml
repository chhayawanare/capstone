cubes:
  - name: payments
    sql_table: public.healthcare_payments

    joins:
      - name: claims
        sql: "{CUBE}.claim_id = {claims.claim_id}"
        relationship: many_to_one

      - name: patients
        sql: "{CUBE}.patient_id = {patients.patient_id}"
        relationship: many_to_one

    dimensions:
      - name: payment_id
        sql: payment_id
        type: string
        primary_key: true

      - name: claim_id
        sql: claim_id
        type: string

      - name: patient_id
        sql: patient_id
        type: string

      - name: payment_date
        sql: payment_date
        type: time

      - name: payment_method
        sql: payment_method
        type: string

    measures:
      - name: count
        type: count

      - name: payment_amount
        sql: payment_amount
        type: sum

      - name: average_payment_amount
        sql: payment_amount
        type: avg
        
    pre_aggregations:
      - name: payments_by_method
        measures:
          - payments.count
          - payments.payment_amount
        dimensions:
          - payments.payment_method